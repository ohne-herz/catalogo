<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Mantenedor</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap{max-width:420px;margin:80px auto;background:#fff;padding:32px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .admin-wrap h1{font-size:1.3rem;margin-bottom:18px;}
  .admin-wrap label{display:block;font-size:.85rem;font-weight:600;margin-bottom:14px;}
  .admin-wrap input{width:100%;margin-top:6px;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;}
  .admin-wrap button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;margin-top:6px;}
</style>
</head>
<body>
  <div class="admin-wrap">
    <h1>Acceso administrador</h1>
    <form id="loginForm">
      <label>Usuario
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>Contraseña
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Ingresar</button>
    </form>
    <p class="feedback" id="feedback"></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const feedback = document.getElementById('feedback');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      feedback.textContent = '';
      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Error al ingresar');
        window.location.href = '/panel.html';
      } catch (err) {
        feedback.textContent = err.message;
        feedback.className = 'feedback err';
      }
    });
  </script>
</body>
</html>
