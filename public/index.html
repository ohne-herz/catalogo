<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminales de Pago | Solicita tu cotización</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <h1>Terminales de pago para tu negocio</h1>
  <p>Elige el dispositivo que te interesa y te contactamos.</p>
</header>

<main class="grid" id="grid">
  <article class="card" data-device="get-mini" data-label="Getnet Get Mini">
    <img src="https://site.getnet.com.br/wp-content/uploads/2023/02/get-mini-2.png" alt="Getnet Get Mini">
    <h3>Get Mini</h3>
    <button class="cta">Quiero cotizar</button>
  </article>

  <article class="card" data-device="get-classica" data-label="Getnet Get Clássica">
    <img src="https://site.getnet.com.br/wp-content/uploads/2024/04/positionfront-1.png" alt="Getnet Get Clássica">
    <h3>Get Clássica</h3>
    <button class="cta">Quiero cotizar</button>
  </article>

  <article class="card" data-device="get-smart" data-label="Getnet Get Smart">
    <img src="https://site.getnet.com.br/wp-content/uploads/2024/04/positionFront-2.png" alt="Getnet Get Smart">
    <h3>Get Smart</h3>
    <button class="cta">Quiero cotizar</button>
  </article>
</main>

<!-- Modal formulario -->
<div class="modal-overlay" id="overlay">
  <div class="modal">
    <button class="close" id="closeModal" aria-label="Cerrar">&times;</button>
    <h2 id="modalTitle">Cotizar dispositivo</h2>
    <p class="modal-sub">Déjanos tus datos y te contactamos a la brevedad.</p>

    <form id="leadForm">
      <label>Nombre completo
        <input type="text" name="name" required maxlength="120">
      </label>
      <label>Email
        <input type="email" name="email" required maxlength="160">
      </label>
      <label>Teléfono
        <input type="tel" name="phone" required maxlength="40" placeholder="+56 9 1234 5678">
      </label>
      <input type="hidden" name="device" id="deviceInput">
      <button type="submit" class="submit-btn" id="submitBtn">Enviar</button>
    </form>

    <p class="feedback" id="feedback"></p>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
